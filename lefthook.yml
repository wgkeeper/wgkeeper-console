# Fast checks on commit, the full CI set on push.
# Go tools are looked up in PATH (e.g. Homebrew) and then in $(go env GOPATH)/bin (go install).
pre-commit:
  parallel: true
  commands:
    frontend-format:
      glob: "frontend/src/**/*.{ts,tsx}"
      run: cd frontend && pnpm format:check
    frontend-lint:
      glob: "frontend/src/**/*.{ts,tsx}"
      run: cd frontend && pnpm lint
    frontend-types:
      glob: "frontend/src/**/*.{ts,tsx}"
      run: cd frontend && pnpm exec tsc -b
    backend-format:
      root: "backend/"
      glob: "*.go"
      run: gofmt -l {staged_files} | grep . && echo "run gofmt" && exit 1 || exit 0
    backend-vet:
      glob: "backend/**/*.go"
      run: cd backend && go vet ./...

pre-push:
  parallel: true
  commands:
    frontend-build:
      glob: "frontend/src/**/*.{ts,tsx}"
      run: cd frontend && pnpm build
    frontend-tests:
      glob: "frontend/src/**/*.{ts,tsx}"
      run: cd frontend && pnpm test
    backend-lint:
      glob: "backend/**/*.go"
      run: cd backend && PATH="$PATH:$(go env GOPATH)/bin" golangci-lint run ./...
    backend-tests:
      glob: "backend/**/*.go"
      run: cd backend && go test -race ./...
    backend-govulncheck:
      glob: "backend/**/*.go"
      run: cd backend && PATH="$PATH:$(go env GOPATH)/bin" govulncheck ./...
    backend-mod-tidy:
      glob: "backend/{go.mod,go.sum,**/*.go}"
      run: cd backend && go mod tidy -diff
