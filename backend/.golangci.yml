version: "2"

run:
  timeout: 5m

issues:
  # Show every finding, not the first three per linter.
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - noctx
    - revive
    - gosec
    - unconvert
    - misspell
    - unparam
    - modernize
    - gocritic
    - usetesting
    - nilnil
    - sloglint

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    revive:
      severity: warning
    sloglint:
      # Log keys are snake_case (request_id, node_id) so log queries stay predictable.
      key-naming-case: snake
  exclusions:
    paths:
      # Generated by swag in CI and in the Docker build.
      - docs
    rules:
      - path: '.*_test\.go$'
        linters:
          - errcheck
          - gosec
          - noctx
          - nilnil
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - wg-keeper-backend
