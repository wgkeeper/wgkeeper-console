# Example nginx site for wgkeeper-console.
#
# nginx terminates TLS, optionally lets only your addresses through, and
# proxies to the console's plain-HTTP port. In Docker, examples/nginx/compose.yml
# mounts it; on the host, put it in the http context (for example
# /etc/nginx/conf.d/wgkeeper-console.conf) and change proxy_pass below. Needs
# nginx 1.25.1+ for "http2 on".

# Optional rate limit, used by limit_req below. The console rate-limits logins
# and the API itself; this protects it from floods before they get there.
# limit_req_zone $binary_remote_addr zone=wgkeeper_console:10m rate=20r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.example.com;

    ssl_certificate     /etc/letsencrypt/live/console.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Optional: allow only your own addresses (office, VPN).
    # allow 203.0.113.7;
    # deny all;

    # Optional: see limit_req_zone above.
    # limit_req zone=wgkeeper_console burst=40 nodelay;

    # The console rejects bodies over 1 MB itself.
    client_max_body_size 1m;

    location / {
        # The console over the Docker network (nginx installed on the host:
        # http://127.0.0.1:8000). The port must match PORT.
        proxy_pass http://console:8000;

        proxy_set_header Host $host;
        # Overwrite, don't append: with TRUSTED_PROXIES set, the console rate-limits
        # by this address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A status refresh of many nodes can take up to 20s.
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }
}
