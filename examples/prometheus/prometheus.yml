# Example Prometheus config for wgkeeper-console.
#
# Scrapes the console's metrics endpoint inside the Docker network. Enable it
# first in console.env (see docs/metrics.md):
#
#   METRICS_PORT=9100
#   METRICS_TOKEN=<openssl rand -hex 32>
#
# and put the same token in ./console-metrics-token, mounted below.
global:
  scrape_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: wgkeeper-console
    authorization:
      credentials_file: /etc/prometheus/console-metrics-token
    static_configs:
      - targets: ["console:9100"]
